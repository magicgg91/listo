# Listo en local, pour tester sur son ordinateur avant de publier.
#
# Construit l'image à partir du code du dépôt, puis la démarre :
#   docker compose -f docker-compose.dev.yml up --build
# Ensuite, ouvrir http://localhost:3000 (ou http://localhost:3000/healthz).
# Arrêt : Ctrl+C, puis « docker compose -f docker-compose.dev.yml down ».
#
# Par défaut, le port n'est ouvert que sur l'ordinateur lui-même (127.0.0.1),
# jamais sur le réseau.
#
# Pour essayer depuis un téléphone du même réseau Wi-Fi (voir
# docs/developpement.md, « Essayer sur son téléphone »), deux réglages facultatifs :
#   LISTO_DEV_BIND=0.0.0.0                       ouvre le port au réseau local
#   LISTO_DEV_URL=http://192.168.1.20:3000       adresse de l'ordinateur, telle
#                                                que le téléphone la tape
# Exemple :
#   LISTO_DEV_BIND=0.0.0.0 LISTO_DEV_URL=http://192.168.1.20:3000 \
#     docker compose -f docker-compose.dev.yml up --build

services:
  listo:
    build: .
    container_name: listo-dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TZ=Europe/Paris
      - LISTO_PUBLIC_URL=${LISTO_DEV_URL:-http://localhost:3000}
      - LISTO_DB_PATH=/data/listo.db
      - LISTO_KEY_PATH=/secrets/secret.key
      - LISTO_SESSION_DAYS=30
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    ports:
      - "${LISTO_DEV_BIND:-127.0.0.1}:3000:3000"
