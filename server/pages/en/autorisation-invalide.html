<!doctype html>
<!-- Listo (version anglaise de server/pages/autorisation-invalide.html) : réponse unique pour une demande d'autorisation (connexion d'un
     assistant IA) qui ne peut pas être vérifiée : application inconnue,
     adresse de retour refusée, paramètres manquants, ou erreur à renvoyer
     vers un site qui n'est pas connu. Toujours la
     même page : AUCUNE redirection n'est faite dans ce cas, et rien de la
     demande n'est recopié dans la page. -->
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Listo · Invalid authorization request</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/listo.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- sprite -->
<div class="app">
  <div class="empty">
    <span class="empty__icon"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-alert"/></svg></span>
    <h1 class="empty__title">Invalid authorization request</h1>
    <p class="empty__text">This connection request could not be verified. Start the connection again from your AI assistant.</p>
  </div>
</div>
</body>
</html>
