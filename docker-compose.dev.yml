# Listo locally, to test on your computer before publishing.
#
# Builds the image from the repository's code, then starts it:
#   docker compose -f docker-compose.dev.yml up --build
# Then open http://localhost:3000 (or http://localhost:3000/healthz).
# Stop: Ctrl+C, then “docker compose -f docker-compose.dev.yml down”.
#
# By default, the port is only open on the computer itself (127.0.0.1),
# never on the network.
#
# To try it from a phone on the same Wi-Fi network (see
# docs/developpement.md, “Essayer sur son téléphone”, in French), two optional settings:
#   LISTO_DEV_BIND=0.0.0.0                       opens the port to the local network
#   LISTO_DEV_URL=http://192.168.1.20:3000       address of the computer, as
#                                                the phone types it
# Example:
#   LISTO_DEV_BIND=0.0.0.0 LISTO_DEV_URL=http://192.168.1.20:3000 \
#     docker compose -f docker-compose.dev.yml up --build

services:
  listo:
    build: .
    container_name: listo-dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TZ=Europe/Paris              # time zone: backup around 3 AM, due-date summary at 8 AM
      - LISTO_PUBLIC_URL=${LISTO_DEV_URL:-http://localhost:3000}
      - LISTO_DB_PATH=/data/listo.db
      - LISTO_KEY_PATH=/secrets/secret.key
      - LISTO_SESSION_DAYS=30
      # Default language (fr or en, French when not set) and currency of
      # wish prices (EUR when not set; USD, CHF, GBP…). See docs/guide.en.md.
      # - LISTO_LANG=fr
      # - LISTO_CURRENCY=EUR
      # Optional (as in docker-compose.yml, see docs/guide.en.md,
      # “Settings (variables)”):
      # - LISTO_UPDATE_CHECK=off
      # - LISTO_PRODUCT_LOOKUP=off
      # - LISTO_PRODUCT_CONTACT=https://listo.exemple.fr/contact
      # LISTO_MCP: access for AI assistants, off by default (“AI assistants
      # (MCP)” chapter). Optional: only accept these websites.
      # - LISTO_MCP_SITES=claude.ai,claude.com
      # Push notifications: OFF by default; uncomment the line
      # below to turn them on. Encrypted content: Apple, Google, Mozilla
      # or Microsoft only see the time, the size and the device. Keys
      # created in secrets/vapid.json: back them up along with secret.key.
      # - LISTO_PUSH=on
      # Sign-in with an OpenID Connect identity provider (Authelia,
      # Authentik, Pocket ID…): OFF by default; see docs/guide.en.md,
      # “Sign-in with an identity provider”. Client secret
      # in secrets/oidc-client-secret (never here). LISTO_OIDC_NAME: name
      # shown on screen (“SSO” by default).
      # - LISTO_OIDC=on
      # - LISTO_OIDC_ISSUER=https://auth.exemple.fr
      # - LISTO_OIDC_CLIENT_ID=listo
      # - LISTO_OIDC_NAME=Authelia
      # Password sign-in: on by default; “off” = identity provider
      # only (requires LISTO_OIDC=on; password sessions are closed)
      # - LISTO_LOCAL_LOGIN=off
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    ports:
      - "${LISTO_DEV_BIND:-127.0.0.1}:3000:3000"
