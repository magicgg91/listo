# Listo in production, behind an HTTPS reverse proxy (Nginx Proxy Manager, Caddy,
# Traefik, nginx…: any of them will do; what it must do: docs/guide.en.md,
# “What the proxy must do”). The example below: proxy on another machine.
#
# Put this file alone on the server (no source code is needed), then:
#   docker compose up -d                     (start)
#   docker logs listo                        (view the logs)
#   docker compose pull && docker compose up -d   (update)
#   docker exec -u node listo node server/backup-now.js   (backup on demand)
# The full guide (installation, backup, restore, troubleshooting) is
# in the repository: README, then docs/guide.en.md (Installation chapter);
# updates and restore: docs/exploitation.md (in French).
#
# As the proxy is not on the same machine, there is no shared Docker
# network: Listo publishes its port on the server's local network address
# (IP_LOCALE), never on all interfaces. In the proxy: http scheme,
# this IP address and port 13300; HTTPS ends at the proxy. Opening Listo directly at http://IP:13300 does not let you
# sign in (origin and Secure cookie refused): this is intended.
# A firewall that only lets the proxy's address reach this port is
# recommended.
# No password or key here: the key is generated on first start.

services:
  listo:
    image: ghcr.io/magicgg91/listo:latest   # built by GitHub Actions
    container_name: listo
    restart: unless-stopped
    # All the variables read by Listo (none of them contains a secret)
    environment:
      - NODE_ENV=production          # production: “Secure” cookies, https required
      - PORT=13300                   # port listened on inside the container (the same as below)
      - TZ=Europe/Paris              # time zone: backup around 3 AM, due-date summary at 8 AM (Paris time)
      - LISTO_PUBLIC_URL=https://listo.exemple.fr   # TO REPLACE: your subdomain, with https (otherwise Listo refuses to start)
      - LISTO_DB_PATH=/data/listo.db                # database (in the data volume)
      - LISTO_KEY_PATH=/secrets/secret.key          # 2FA encryption key, created on first start (secrets volume)
      - LISTO_SESSION_DAYS=30        # how long a session lasts without signing in again, in days
      # Default language (fr or en, French when not set) and currency of
      # wish prices (EUR when not set; USD, CHF, GBP…). See docs/guide.en.md.
      # - LISTO_LANG=fr
      # - LISTO_CURRENCY=EUR
      # Update check (Settings › About, Admin): at most once
      # an hour, the container asks api.github.com (without an account or
      # token) whether a newer image exists. Nothing installs by itself.
      # Uncomment the line below to turn it off (no request to GitHub).
      # - LISTO_UPDATE_CHECK=off
      # Scan mode of shopping lists: the container asks world.openfoodfacts.org
      # for a product's name from its barcode (the picture stays on
      # the phone; only the number is sent). Uncomment the line
      # below to turn it off (“Scan” button hidden, no request).
      # - LISTO_PRODUCT_LOOKUP=off
      # Optional: contact (email address or URL) added to the User-Agent
      # header sent to Open Food Facts, which asks for it to reach the
      # application if there is a problem. Without it: project address only.
      # - LISTO_PRODUCT_CONTACT=https://exemple.fr/contact
      # LISTO_MCP: access for AI assistants (Claude, for example), off by
      # default and deliberately left out of here; to turn it on, first read
      # docs/guide.en.md, chapter “AI assistants (MCP)” (real trial before
      # production). Optional, with it: only accept these AI assistant
      # websites (otherwise, any assistant that follows the standard, always
      # after the person approves).
      # - LISTO_MCP_SITES=claude.ai,claude.com
      # Push notifications: OFF by default; uncomment the line
      # below to turn them on. Encrypted content: Apple, Google, Mozilla
      # or Microsoft only see the time, the size and the device. Keys
      # created in secrets/vapid.json: back them up along with secret.key.
      # - LISTO_PUSH=on
      # Sign-in with an OpenID Connect identity provider (Authelia,
      # Authentik, Pocket ID…): OFF by default; see docs/guide.en.md,
      # “Sign-in with an identity provider”. Client secret
      # in secrets/oidc-client-secret (never here). LISTO_OIDC_NAME: name
      # shown on screen (“SSO” by default).
      # - LISTO_OIDC=on
      # - LISTO_OIDC_ISSUER=https://auth.exemple.fr
      # - LISTO_OIDC_CLIENT_ID=listo
      # - LISTO_OIDC_NAME=Authelia
      # Password sign-in: on by default; “off” = identity provider
      # only (requires LISTO_OIDC=on; password sessions are closed)
      # - LISTO_LOCAL_LOGIN=off
    ports:
      - "IP_LOCALE:13300:13300"   # replace with the server's address on the local network, never 0.0.0.0
    volumes:
      - ./data:/data         # listo.db database, backups (backups/), photos, journal.log
      - ./secrets:/secrets   # encryption key, kept apart from the database (never in data/backups)
