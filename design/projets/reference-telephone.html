<!-- Thème : ajouter ?theme=dark à l'adresse (ou changer data-theme ci-dessus).
     ../../public/css/app.css : les éléments qui existent déjà dans l'application (lu tel quel, rien n'y est changé). -->
<script>if (/[?&]theme=dark/.test(location.search)) document.documentElement.dataset.theme = 'dark';
// Comme l'application : l'onglet de la colonne choisie est ramené en vue, et
// les écrans « carte-2 » et « carte-3 » montrent la carte déjà défilée
// (rappelé par capture.mjs après avoir isolé un écran)
window.prepare = () => {
  for (const tab of document.querySelectorAll('.coltab[aria-selected="true"]')) {
    const bar = tab.parentElement;
    bar.scrollLeft = tab.offsetLeft - (bar.clientWidth - tab.offsetWidth) / 2;
  }
  for (const box of document.querySelectorAll('[data-scroll-to]')) {
    const target = box.querySelector(`[data-anchor="${box.dataset.scrollTo}"]`);
    if (target) box.scrollTop = target.offsetTop - box.offsetTop - 8;
  }
};
addEventListener('load', () => window.prepare());</script>
