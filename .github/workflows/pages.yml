# Publie la page publique du guide (dossier site/) sur GitHub Pages,
# https://magicgg91.github.io/listo/, à chaque fusion sur la branche main.
#
# site/ est fabriqué par scripts/guide.js à partir de la source unique du
# guide (public/js/help-content.js) ; un test vérifie qu'il est à jour avant
# la fusion. Ce workflow ne fabrique rien : il publie ce dossier tel quel, et
# seulement lui (ni docs/, ni le reste du dépôt).
#
# À faire une fois par le propriétaire : Settings › Pages › Source :
# « GitHub Actions ».
#
# Aucun secret : le jeton fourni par GitHub suffit, avec les seules
# permissions nécessaires. Chaque action est épinglée sur l'empreinte de son
# commit (SHA complet), avec sa version en commentaire ; Dependabot propose
# les nouvelles versions.

name: Site du guide

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de le lancer à la main depuis l'onglet Actions

# Rien par défaut ; le travail reçoit seulement ce qu'il lui faut
permissions: {}

# Une seule publication à la fois ; celle en cours va jusqu'au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire le dépôt
      pages: write # publier sur GitHub Pages
      id-token: write # prouver à GitHub Pages que la publication vient de ce workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer le dossier site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
