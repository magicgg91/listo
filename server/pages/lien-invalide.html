<!doctype html>
<!-- Listo : réponse unique pour tout lien public inconnu, expiré, arrêté, dont
     la liste est supprimée ou dont le propriétaire est désactivé. Toujours la
     même page, au caractère près : elle ne dit rien de la raison. -->
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Listo · Lien expiré ou inexistant</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/listo.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- sprite -->
<div class="app">
  <div class="empty">
    <span class="empty__icon"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-link-off"/></svg></span>
    <h1 class="empty__title">Lien expiré ou inexistant</h1>
    <p class="empty__text">Ce lien n'est plus valide. Demander un nouveau lien à la personne qui l'a envoyé.</p>
  </div>
</div>
</body>
</html>
