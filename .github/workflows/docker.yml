# Construit l'image Docker de Listo et la publie sur GitHub Container Registry
# (ghcr.io/magicgg91/listo) à chaque fusion sur la branche main.
#
# Le compose de production n'a ensuite qu'à utiliser `image:` (pas `build:`) :
#   docker compose pull && docker compose up -d
#
# S'il n'y a pas de Dockerfile, le workflow ne construit rien et le signale
# sans échouer.
#
# Chaque action est épinglée sur l'empreinte de son commit (SHA complet), avec
# sa version en commentaire : une étiquette déplacée chez l'éditeur ne peut
# pas changer ce qui s'exécute ici. Dependabot propose les nouvelles versions.

name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de le lancer à la main depuis l'onglet Actions

permissions:
  contents: read
  packages: write # nécessaire pour publier l'image sur ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # magicgg91/listo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier la présence du Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de Dockerfile pour l'instant : aucune image construite."
          fi

      - name: Préparer Docker Buildx
        if: steps.dockerfile.outputs.found == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Se connecter à ghcr.io
        if: steps.dockerfile.outputs.found == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes de l'image
        if: steps.dockerfile.outputs.found == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construire et publier l'image
        if: steps.dockerfile.outputs.found == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
