# Listo en production, derrière Nginx Proxy Manager (installé sur une autre machine).
#
# À placer seul sur le serveur (aucun code source n'est nécessaire), puis :
#   docker compose up -d                     (démarrer)
#   docker logs listo                        (voir les journaux)
#   docker compose pull && docker compose up -d   (mettre à jour)
#   docker exec -u node listo node server/backup-now.js   (sauvegarde à la demande)
# Le guide complet (installation, sauvegarde, restauration, dépannage) est
# dans le dépôt : README, puis docs/exploitation.md.
#
# Nginx Proxy Manager n'étant pas sur la même machine, il n'y a pas de réseau
# Docker partagé : Listo publie son port sur l'adresse du réseau local du
# serveur (IP_LOCALE), jamais sur toutes les interfaces. Dans Nginx Proxy
# Manager : schéma http, cette adresse IP et le port 13300 ; le HTTPS s'arrête
# chez lui. Ouvrir Listo directement par http://IP:13300 ne permet pas de se
# connecter (origine et cookie Secure refusés) : c'est voulu.
# Un pare-feu qui n'autorise que l'adresse de Nginx Proxy Manager à joindre ce
# port est recommandé.
# Aucun mot de passe ni clé ici : la clé est générée au premier démarrage.

services:
  listo:
    image: ghcr.io/magicgg91/listo:latest   # construite par GitHub Actions
    container_name: listo
    restart: unless-stopped
    # Toutes les variables lues par Listo (aucune ne contient de secret)
    environment:
      - NODE_ENV=production          # production : cookies « Secure », https obligatoire
      - PORT=13300                   # port d'écoute dans le conteneur (le même que ci-dessous)
      - TZ=Europe/Paris              # fuseau horaire : sauvegarde de la nuit vers 3 h, heure de Paris
      - LISTO_PUBLIC_URL=https://listo.exemple.fr   # À REMPLACER : votre sous-domaine, en https (sinon Listo refuse de démarrer)
      - LISTO_DB_PATH=/data/listo.db                # base (dans le volume data)
      - LISTO_KEY_PATH=/secrets/secret.key          # clé de chiffrement 2FA, créée au 1er démarrage (volume secrets)
      - LISTO_SESSION_DAYS=30        # durée d'une session sans se reconnecter, en jours
      # Vérification de mise à jour (Réglages › À propos, Admin) : au plus une
      # fois par heure, le conteneur demande à api.github.com (sans compte ni
      # jeton) s'il existe une image plus récente. Rien ne s'installe tout seul.
      # Décommenter la ligne ci-dessous pour la couper (aucune demande vers GitHub).
      # - LISTO_UPDATE_CHECK=off
    ports:
      - "IP_LOCALE:13300:13300"   # à remplacer par l'adresse du serveur sur le réseau local, jamais 0.0.0.0
    volumes:
      - ./data:/data         # base listo.db, sauvegardes (backups/), photos, journal.log
      - ./secrets:/secrets   # clé de chiffrement, gardée à part de la base (jamais dans data/backups)
